[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfs"
version = "0.1.0"
description = "A fast, local, privacy-first CLI for file anomaly detection and clustering"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
mlfs = "mlfs.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
